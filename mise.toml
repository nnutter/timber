[tools]
jactionlint = "latest"
# constable embeds the errcheck, sumtype, testifylint, and nilaway analyzers,
# so it replaces those linters rather than running beside them.
"packslip:nnutter/constable" = { version = "latest", "minimum_release_age" = "0" }
"packslip:nnutter/mdlint" = { version = "latest", "minimum_release_age" = "0" }
"github:securego/gosec" = "latest"
betterleaks = "latest"
go = "latest"
"go:github.com/kojah/gohawk" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
gofumpt = "latest"
hk = "2.14.0"
node = "latest"
oxfmt = "latest"
oxlint = "latest"
"npm:typescript" = "latest"
pkl = "latest"
shellcheck = "latest"
shfmt = "latest"
"pipx:agentskills-tools" = "latest"
staticcheck = "latest"
tombi = "latest"
yamlfmt = "latest"
python = "3.14"
uv = "0.13.9"

[tasks.all]
description = "Run fix, test, and check"
run = [{ task = "fix" }, { task = "test" }, { task = "check" }]

[tasks.ci-test]
description = "Require shell test dependencies and run the full suite"
run = '''
#!/usr/bin/env bash
set -euo pipefail
python3 -c 'import os, pty; master, slave = pty.openpty(); os.close(master); os.close(slave)'
go test -race -shuffle=on -cover -timeout 20m ./...
'''

[tasks.demo]
description = "Render the README terminal demo (GIF/MP4/still) with VHS"
run = '''
#!/usr/bin/env bash
set -euo pipefail
go tool vhs docs/demo/demo.tape
'''

[tasks.coverage]
description = "Measure coverage across package boundaries"
run = "go test -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./... && go tool cover -func=coverage.out"

[tasks.coverage-process]
description = "Measure coverage in CLI subprocesses that can flush counters on exit"
run = '''
#!/usr/bin/env bash
set -euo pipefail
export GOCOVERDIR
GOCOVERDIR="$(mktemp -d "$PWD/.coverage-process.XXXXXX")"
trap 'rm -rf "$GOCOVERDIR"' EXIT
go test -count=1 . ./internal/cli ./internal/cli/review
go tool covdata textfmt -i="$GOCOVERDIR" -o=coverage-process.out
go tool cover -func=coverage-process.out
'''

[tasks.upgrade]
description = "Upgrade and commit mise tools and shared hk config"
run = "scripts/upgrade-tools"

[tasks.install]
description = "Install hk git hooks"
run = "hk install --mise"

[tasks.setup]
description = "Install Pi extension types and hk Git hooks"
run = ["npm ci --ignore-scripts", { task = "install" }]

[tasks.test]
description = "Run tests with coverage"
run = "go test -cover ./..."

[tasks.fix]
description = "Fix all files, or only the supplied files"
usage = 'arg "[staged_files]" var=#true'
run = '''
if [ -z "${usage_staged_files:-}" ]; then
  hk fix --all
else
  hk fix ${usage_staged_files}
fi
'''

[tasks.check]
description = "Check all files without writing fixes"
run = "hk check --all"

[tasks.validate]
description = "Run checks and tests without applying fixes"
run = [{ task = "check" }, { task = "test" }]

[tasks.on-start]
description = "Pi mise-hooks: run fixes, tests, and checks before agent starts"
run = [{ task = "all" }]

[tasks.on-stop]
description = "Pi mise-hooks: fix edited files, then test and check"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run fix "$@"
mise run test
mise run check
'''
