[settings]
minimum_release_age = "0"

[tools]
go = "latest"
hk = "2.10.0"
pkl = "latest"
tombi = "latest"
yamlfmt = "latest"
"github:nnutter/mdlint" = "latest"
uv = "latest"
gofumpt = "latest"
staticcheck = "latest"
gitleaks = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
"go:github.com/securego/gosec/v2/cmd/gosec" = "latest"
"go:github.com/kisielk/errcheck" = "latest"
"go:github.com/alecthomas/go-check-sumtype/cmd/go-check-sumtype" = "latest"
"go:go.uber.org/nilaway/cmd/nilaway" = "latest"
"go:github.com/nnutter/constable/cmd/constable" = "latest"
"go:github.com/nnutter/timber" = "latest"
"go:github.com/nnutter/testifylint" = "latest"

#####################
# Development Tasks #
#####################

[tasks.all]
description = "Run fixes, tests, and checks"
run = [{ task = "fix" }, { task = "test" }, { task = "check" }]

[tasks.ci-test]
description = "Require shell test dependencies and run the full suite"
run = '''
#!/usr/bin/env bash
set -euo pipefail
python3 -c 'import os, pty; master, slave = pty.openpty(); os.close(master); os.close(slave)'
go test -race -shuffle=on -cover ./...
'''

[tasks.demo]
description = "Render the README terminal demo (GIF/MP4/still) with VHS"
run = '''
#!/usr/bin/env bash
set -euo pipefail
go tool vhs docs/demo/demo.tape
'''

[tasks.coverage]
alias = "cover"
description = "Run tests and generate coverage report"
run = "go test -coverprofile=coverage.out -covermode=atomic ./... && go tool cover -func=coverage.out"

[tasks.setup]
description = "Install hk Git hooks without removing other hook managers"
run = "hk install --mise"

[tasks.refresh-template]
description = "Refresh from template"
run = "git tpl update && git tpl merge"

[tasks.pre-commit]
description = "Format staged files"
run = '''
#!/usr/bin/env bash
set -euo pipefail
go tool gitleaks git --redact --pre-commit --staged
mise run fix "$@"
'''

[tasks.test]
description = "Run tests (with the race detector)"
run = "go test -cover ./..."

#############
# Fix Tasks #
#############

[tasks.fix]
description = "Fix selected files safely, or run all-files writers"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ "$#" -gt 0 ]; then
  hk check --fix --no-stage --step go-imports "$@"
  hk check --fix --no-stage --step go-fumpt "$@"
  hk check --fix --no-stage --step mdlint --step pkl_format --step tombi_format --step yamlfmt "$@"
  mise run fix-go-fix "$@"
  mise run fix-go-mod-tidy "$@"
else
  hk check --fix --no-stage --all --step go-imports
  hk check --fix --no-stage --all --step go-fumpt
  hk check --fix --no-stage --all --step mdlint --step pkl_format --step tombi_format --step yamlfmt
  mise run fix-go-fix
  mise run fix-go-mod-tidy
fi
'''

[tasks.check]
alias = "static-analysis"
description = "Run checks, linters, scan for secrets, and validate skills"
run = [
  "hk check --all",
  { task = "lint-constable" },
  # TODO: Failing after Go upgrade
  # { task = "lint-errcheck" },
  { task = "lint-gitleaks" },
  { task = "lint-go-check-sumtype" },
  { task = "lint-go-vet" },
  { task = "lint-gosec" },
  { task = "lint-govulncheck" },
  { task = "lint-nilaway" },
  { task = "lint-skills" },
  # TODO: Failing after Go upgrade
  # { task = "lint-staticcheck" },
  # TODO: Failing after Go upgrade
  # { task = "lint-testifylint" },
]

[tasks.fix-gofumpt]
description = "Run code formatting tools"
run = '''
#!/usr/bin/env bash
set -eo pipefail
if [ "$#" -eq 0 ]; then
  go tool gofumpt -l -w .
  exit 0
fi
go_files=()
for f in "$@"; do
  case "$f" in
    *.go)
      case "$f" in -*) f="./$f" ;; esac
      go_files+=("$f")
      ;;
  esac
done
[[ -v go_files[0] ]] || exit 0
go tool gofumpt -l -w "${go_files[@]}"
'''

[tasks.fix-goimports]
description = "Run code formatting tools"
run = '''
#!/usr/bin/env bash
set -eo pipefail
if [ "$#" -eq 0 ]; then
  go tool goimports -l -w -local $(go list -m) .
  exit 0
fi
go_files=()
for f in "$@"; do
  case "$f" in
    *.go)
      case "$f" in -*) f="./$f" ;; esac
      go_files+=("$f")
      ;;
  esac
done
[[ -v go_files[0] ]] || exit 0
go tool goimports -l -w -local "$(go list -m)" "${go_files[@]}"
'''

[tasks.fix-go-fix]
description = "Apply go fix"
run = '''
#!/usr/bin/env bash
set -eo pipefail
if [ "$#" -gt 0 ]; then
  diff=$(go fix -diff ./...)
  printf '%s' "$diff"
  [ -z "$diff" ]
  exit $?
fi
go fix ./...
'''

[tasks.fix-go-mod-tidy]
description = "Tidy go.mod and go.sum"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ "$#" -gt 0 ]; then
  go mod tidy -diff
  exit $?
fi
go mod tidy
'''

[tasks.fix-testifylint]
description = "Run testifylint static analysis"
run = '''
#!/usr/bin/env bash
set -eo pipefail
if [ "$#" -eq 0 ]; then
  go tool testifylint -fix ./...
  exit 0
fi
# Package analysis can include unselected files, so do not enable -fix.
declare -A seen=()
dirs=()
for f in "$@"; do
  case "$f" in
    *.go)
      d=$(dirname -- "$f")
      case "$d" in ./*|/*) ;; *) d="./$d" ;; esac
      if [[ ! ${seen[$d]+present} ]]; then
        seen[$d]=1
        dirs+=("$d")
      fi
      ;;
  esac
done
[[ -v dirs[0] ]] || exit 0
go tool testifylint "${dirs[@]}"
'''

##############
# Lint Tasks #
##############

[tasks.lint-constable]
description = "Checks nonmutating directives"
run = "go tool constable ./..."

[tasks.lint-errcheck]
description = "Check for unhandled errors"
run = "go tool errcheck ./..."

[tasks.lint-gitleaks]
description = "Scan the Git history for secrets"
run = "go tool gitleaks dir --verbose --redact ."

[tasks.lint-go-check-sumtype]
description = "Check sealed sum-type switches for exhaustiveness"
run = "go tool go-check-sumtype -default-signifies-exhaustive=false -include-shared-interfaces ./..."

[tasks.lint-go-vet]
description = "Run go vet static analysis"
run = "go vet ./..."

[tasks.lint-gosec]
description = "Run gosec static analysis"
run = "go tool gosec -severity high -quiet ./..."

[tasks.lint-govulncheck]
description = "Check for vulnerabilities"
run = "go tool govulncheck ./..."

[tasks.lint-nilaway]
description = "Run nilaway on github.com/nnutter packages"
run = "go tool nilaway -include-pkgs $(go list -m) ./..."

[tasks.lint-skills]
description = "Validate agent skills"
run = '''
#!/usr/bin/env bash
set -euo pipefail
status=0
for skill in skills/*/; do
  if ! uvx --from 'git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref' skills-ref validate "$skill"; then
    status=1
  fi
done
exit "$status"
'''

[tasks.lint-staticcheck]
description = "Run staticcheck static analysis"
run = "go tool staticcheck ./..."

[tasks.lint-testifylint]
description = "Run testifylint static analysis"
run = "go tool testifylint ./..."

#####################
# Agent Hooks       #
#####################

[tasks.on-start]
description = "Pi mise-hooks: run fixes, tests, and checks before agent starts"
run = [{ task = "all" }]

[tasks.on-stop]
description = "Pi mise-hooks: fix edited files, then test and check"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run fix "$@"
mise run test
mise run check
'''
